openapi: 3.1.0
info:
  title: TWY Class Plans and Newsletters
  description: Class plan authoring (per-date) and monthly Yoga Habit newsletter authoring for Tiffany Wood Yoga. Class-plan endpoints and newsletter endpoints are distinct - see operation descriptions for routing.
  version: "1.3.0"
servers:
  - url: https://classes.tiffanywoodyoga.com
paths:
  /api/ping:
    get:
      operationId: ping
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/overview:
    get:
      operationId: getYearOverview
      summary: Get the full yearly curriculum overview (all 12 months)
      responses:
        "200":
          description: Object keyed by month number string ("1"–"12")
          content:
            application/json:
              schema:
                type: object
                properties: {}
                additionalProperties: { $ref: "#/components/schemas/MonthlyOverview" }

  /api/overview/{month}:
    get:
      operationId: getMonthOverview
      summary: Get the curriculum overview for a single month
      parameters:
        - name: month
          in: path
          required: true
          description: Month number (1–12)
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Monthly overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyOverview" }
        "404":
          description: No overview for that month

  /api/plans:
    get:
      operationId: listClassPlans
      summary: List class plans, optionally filtered by date range
      parameters:
        - name: from
          in: query
          description: Start date inclusive (YYYY-MM-DD)
          schema: { type: string }
        - name: to
          in: query
          description: End date inclusive (YYYY-MM-DD)
          schema: { type: string }
      responses:
        "200":
          description: Array of class plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassPlan" }

  /api/plans/{date}:
    get:
      operationId: getClassPlan
      summary: Get a single class plan by date
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema: { type: string }
      responses:
        "200":
          description: Class plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassPlan" }
        "404":
          description: No plan for that date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
    post:
      operationId: upsertClassPlan
      summary: Save one yoga class plan for one specific calendar date (NOT for newsletters)
      description: |
        Save one yoga class plan tied to a single date (YYYY-MM-DD). NOT for newsletters. The monthly Yoga Habit newsletter routes to submitMonthlyHabitNewsletters even though Habit is also a class_type enum value.
      parameters:
        - name: date
          in: path
          required: true
          description: Date in YYYY-MM-DD format
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassPlanInput" }
      responses:
        "200":
          description: Saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean }
                  date: { type: string, description: "Final saved date" }

  /api/plans/batch:
    post:
      operationId: batchUpsertClassPlans
      summary: Save multiple yoga class plans at once, each tied to its own specific date (NOT for newsletters)
      description: |
        Use ONLY for class plans tied to specific calendar dates. Do NOT use for newsletter content
        even when the user asks for "all of [Month]" - monthly newsletter content goes through
        submitMonthlyHabitNewsletters, not this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plans]
              properties:
                plans:
                  type: array
                  items: { $ref: "#/components/schemas/BatchClassPlanInput" }
      responses:
        "200":
          description: Results for each plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: array
                    items: { type: string }
                    description: Dates successfully saved
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        date:  { type: string }
                        error: { type: string }
                    description: Plans that failed to save

  /api/newsletter-prompt/{audience}/{month}:
    get:
      operationId: getNewsletterPrompt
      summary: Get the monthly Yoga Habit newsletter authoring prompt for an audience and month
      description: |
        Call FIRST when drafting monthly Yoga Habit newsletter content. Returns the prompt with month context, key dates, class details. Audiences: lifestyle, non-lifestyle, non-opener, reminder, gentle-nudge, ph1, ph2. Submit via submitMonthlyHabitNewsletters.
      parameters:
        - name: audience
          in: path
          required: true
          description: "One of: lifestyle, non-lifestyle, non-opener, reminder, gentle-nudge, ph1, ph2"
          schema:
            type: string
            enum: [lifestyle, non-lifestyle, non-opener, reminder, gentle-nudge, ph1, ph2]
        - name: month
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: Prompt text
          content:
            text/plain:
              schema: { type: string }
        "400":
          description: Invalid audience
        "404":
          description: Prompt not yet generated

  /api/newsletters/{month}:
    post:
      operationId: submitMonthlyHabitNewsletters
      summary: Submit the monthly Yoga Habit newsletter package (lifestyle + non-lifestyle required; non-opener, reminder, gentle-nudge, ph1, ph2 optional)
      description: |
        Draft or save the monthly Yoga Habit newsletter package. Call getNewsletterPrompt first for each audience. Lifestyle and non-lifestyle are required; others are optional. Every included audience must provide subject, preheader, and body. Not for class plans.
      parameters:
        - name: month
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lifestyle, non_lifestyle]
              properties:
                lifestyle:
                  type: object
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                non_lifestyle:
                  type: object
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                ph1:
                  type: object
                  description: Post-Habit-class follow-up 1 (sent +24hrs). Optional.
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                ph2:
                  type: object
                  description: Post-Habit-class follow-up 2 (sent +7 days). Optional.
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                non_opener:
                  type: object
                  description: Second-send outreach to non-openers of the first non-member newsletter (sent ~5 days before class). Optional.
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                reminder:
                  type: object
                  description: Day-before reminder to registered attendees with practical info (no register link). Optional.
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
                gentle_nudge:
                  type: object
                  description: Soft day-before nudge to openers of the first newsletter who did not register. Optional.
                  required: [subject, preheader, body]
                  properties:
                    subject: { type: string }
                    preheader: { type: string, description: "Required inbox preview text for SendGrid. 40-90 characters, compelling, specific, and not a repeat of the subject." }
                    body: { type: string }
      responses:
        "200":
          description: Saved and posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

components:
  schemas:
    MonthlyOverview:
      type: object
      properties:
        month:             { type: integer, description: "1–12" }
        name:              { type: string, description: "Month name, e.g. March" }
        title:             { type: string, description: "Series title for the month" }
        energetic_pulse:   { type: string }
        upa:               { type: string, description: "Universal Principle(s) of Alignment" }
        apex_pose:         { type: string }
        physical_arc:      { type: string }
        evolutional_focus: { type: string }
        affirmation:       { type: string }
        teaching_notes:    { type: string }

    ClassPlan:
      type: object
      properties:
        id:                 { type: string, description: "UUID4, assigned at creation" }
        date:               { type: string, description: "YYYY-MM-DD" }
        time:               { type: string, description: "HH:MM 24h, e.g. 17:30" }
        duration:           { type: integer, description: "Minutes. Common: 60, 75, 90" }
        title:              { type: string, description: "Short evocative class name" }
        series:             { type: string, description: "Series name, e.g. Clarify" }
        class_type:         { $ref: "#/components/schemas/ClassType" }
        description:        { type: string, description: "Max 3 sentences" }
        apex_pose:          { type: string }
        energetic_pulse:    { type: string }
        teaching_lens:      { type: string, description: "Short thematic teaching intention" }
        physical_focus:     { type: string, description: "Physical focus area, e.g. Twists & Hamstrings" }
        physical_arc:       { type: string }
        upas_key_actions:   { type: string }
        affirmation:        { type: string }
        level:              { type: string, description: "Comma-separated subset of: Fundamentals, 1, 2" }
        categories:         { type: array, items: { $ref: "#/components/schemas/Category" } }
        props:              { type: string, description: "Default: mat, 2 blocks, 1 strap, 1-2 blankets" }
        opening_story:      { type: string }
        closing_reflection: { type: string }
        notes:              { type: string }

    ClassPlanInput:
      type: object
      description: "date is set by the URL path, not the body. Use BatchClassPlanInput for batch saves."
      properties:
        time:               { type: string, description: "HH:MM 24h" }
        duration:           { type: integer }
        title:              { type: string }
        series:             { type: string }
        class_type:         { $ref: "#/components/schemas/ClassType" }
        description:        { type: string, description: "Max 3 sentences" }
        apex_pose:          { type: string }
        energetic_pulse:    { type: string }
        teaching_lens:      { type: string }
        physical_focus:     { type: string }
        physical_arc:       { type: string }
        upas_key_actions:   { type: string }
        affirmation:        { type: string }
        level:              { type: string, description: "Comma-separated subset of: Fundamentals, 1, 2" }
        categories:         { type: array, items: { $ref: "#/components/schemas/Category" } }
        props:              { type: string }
        opening_story:      { type: string }
        closing_reflection: { type: string }
        notes:              { type: string }

    BatchClassPlanInput:
      type: object
      description: "Used in batch saves. date is required here since there is no URL path per item."
      required: [date, class_type, title]
      properties:
        date:               { type: string, description: "YYYY-MM-DD" }
        time:               { type: string, description: "HH:MM 24h" }
        duration:           { type: integer }
        title:              { type: string }
        series:             { type: string }
        class_type:         { $ref: "#/components/schemas/ClassType" }
        description:        { type: string, description: "Max 3 sentences" }
        apex_pose:          { type: string }
        energetic_pulse:    { type: string }
        teaching_lens:      { type: string }
        physical_focus:     { type: string }
        physical_arc:       { type: string }
        upas_key_actions:   { type: string }
        affirmation:        { type: string }
        level:              { type: string, description: "Comma-separated subset of: Fundamentals, 1, 2" }
        categories:         { type: array, items: { $ref: "#/components/schemas/Category" } }
        props:              { type: string }
        opening_story:      { type: string }
        closing_reflection: { type: string }
        notes:              { type: string }

    ClassType:
      type: string
      enum:
        - Strength
        - Stretch
        - Flow
        - "Principles of Anusara®"
        - Dynamic Flow
        - Slow Flow
        - Expansion
        - Meditation
        - Breath
        - Integration
        - Habit

    Category:
      type: string
      enum:
        - "Foundations of Anusara® Yoga"
        - "Integration: Deepening Basics Anusara®"
        - "Dynamic Flow: Hips, Heart, & Core - Anusara®"
        - "Mastery Flow: Expanding Capacity Anusara®"
        - "Heart Openers & Back Bend Strategies"
        - "Upper Body Strength & Arm Balances"
        - "Hip Openers"
        - "Forward Folds & Twists"
        - "Core Strength"
        - "Slow Flow"
        - "Flow"
        - "Meditation"
        - "Therapy"
        - "Breath"
